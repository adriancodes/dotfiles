#######################
### QUALITY OF LIFE ###
#######################

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Allow tmux clipboard to copy to system clipboard
set -s set-clipboard on

# Enable passthrough for panes
set -g allow-passthrough on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Auto renumber windows on close
set -g renumber-windows on

# Aggressive resize (for different screen sizes)
setw -g aggressive-resize on

# Set escape time to zero for faster response
set-option -sg escape-time 0

# Enable focus events for editor integration
set-option -g focus-events on

# Repeat time: how long to wait before repeating a key
set -g repeat-time 1000

# Increase history limit
set -g history-file ~/.tmux-history
set -g history-limit 1000000

# Display panes and messages longer
set -g display-panes-time 2000
set -g display-time 2000

# Monitor activity
setw -g monitor-activity on
set -g visual-activity off

# Date time format
set -g clock-mode-style 12


###########################
### COLOR & APPEARANCE ###
###########################

# Ensure full colors (optimized for macOS)
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Yazi image options: https://yazi-rs.github.io/docs/image-preview/#tmux
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status bar position (uncomment preferred position)
# set -g status-position top
set -g status-position bottom

# Status bar refresh interval
set -g status-interval 5


################
### PLUGINS ###
################

# TPM Plugin Manager (install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'

# Essential plugins
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'              # Better clipboard integration
set -g @plugin 'tmux-plugins/tmux-resurrect'         # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'         # Auto-save sessions

# Optional: Vim/Neovim integration (uncomment if using Vim/Neovim)
# set -g @plugin 'christoomey/vim-tmux-navigator'    # Seamless vim-tmux navigation

# Optional: Additional useful plugins (uncomment to enable)
# set -g @plugin 'sainnhe/tmux-fzf'                  # FZF integration for sessions/windows
# set -g @plugin 'tmux-plugins/tmux-open'            # Open files from tmux
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Show when prefix is active
# set -g @plugin 'catppuccin/tmux'                   # Beautiful theme

# Plugin configurations
set -g @continuum-restore 'on'                        # Auto-restore last session
set -g @resurrect-capture-pane-contents 'on'          # Save pane contents
set -g @yank_selection_mouse 'clipboard'              # Use clipboard for mouse selection

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm'
