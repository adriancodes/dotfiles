####################
### KEY BINDINGS ###
####################

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Move around windows with Ctrl + Shift + <Left/Right>
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

##########################
### PANE MANAGEMENT ###
##########################

# Intuitive pane splitting (opens in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Toggle synchronized panes (broadcast input to all panes)
bind S set-option synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# Pane resizing with repeat
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

################################################################################
### EDITOR MODE SELECTION - Choose ONE section below ###
################################################################################

###################
### EMACS MODE (Default - Uncomment this section for Emacs keybindings) ###
###################

# Enable Emacs keybindings in copy mode
setw -g mode-keys emacs

# Emacs copy mode clipboard integration
bind-key -T copy-mode C-w send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode M-w send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Emacs-style paste
bind-key y paste-buffer

# Optional: Emacs-style pane navigation (with prefix)
# bind-key C-p select-pane -U  # previous (up)
# bind-key C-n select-pane -D  # next (down)
# bind-key C-f select-pane -R  # forward (right)
# bind-key C-b select-pane -L  # backward (left)

# Default Emacs copy mode keys (automatically available):
# - C-Space or Space: Begin selection
# - M-w: Copy selection
# - C-w: Cut selection
# - Enter: Copy and exit
# - C-r / C-s: Search backward/forward
# - M-< / M->: Go to start/end
# - C-v / M-v: Page down/up


